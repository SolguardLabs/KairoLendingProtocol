name: Release Integrity

on:
  push:
    branches: ["main", "production", "release/**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "integrity-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  public-surface:
    name: Public surface and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate public surface
        run: bash scripts/verify-public.sh

      - name: Verify published release convergence
        if: github.event_name == 'release'
        run: bash scripts/verify-release.sh "${{ github.event.release.tag_name }}"
